<div id="toolbar">
  <div class="toolbar-button disabled" id="save-button">
    <i class="fa fa-floppy-o"></i>
    <p class="title" id="save-button-text">No Changes</p>
  </div>
</div>

<div class="settings-container">
  <h2 class="group-header">Proxy</h2>
  <div class="group-item">
    <p class="title">Use Proxy</p>
    <div class="input-tip">    
      <input class="input checkbox" type="checkbox" id="useProxy" onChange='valueChanged()' {%if settings.use_proxy%}checked{%endif%}></input>
    </div>
  </div>
  <div class="group-item">
    <p class="title">Proxy Type</p>
    <div class="input-tip">    
      <select class="input" id="proxyType" onChange='valueChanged()'>
        <option value="" {%if not settings.proxy_type%}selected{%endif%}>None</option>
        <option value="http" {%if settings.proxy_type == "http"%}selected{%endif%}>HTTP</option>
        <option value="socks5" {%if settings.proxy_type == "socks5"%}selected{%endif%}>Socks5</option>
      </select>
    </div>
  </div>
  <div class="group-item">
    <p class="title">Proxy Host</p>
    <div class="input-tip">    
      <input class="input" type="text" id='proxyHost' onChange='valueChanged()' {%if settings.proxy_host%} value="{{settings.proxy_host}}" {%endif%}></input>
    </div>
  </div>
  <div class="group-item">
    <p class="title">Proxy Port</p>
    <div class="input-tip">    
      <input class="input" type="text" id='proxyPort' onChange='valueChanged()' {%if settings.proxy_port%} value="{{settings.proxy_port}}" {%endif%}></input>
    </div>
  </div>
  <div class="group-item">
    <p class="title">Proxy Username</p>
    <div class="input-tip">
      <input class="input" type="text" id="proxyUsername" onChange='valueChanged()' {%if settings.proxy_username%} value="{{settings.proxy_username}}" {%endif%}></input>
      <p class="tip">You only need to enter a username and password if one is required. Leave them blank otherwise.</p>
    </div>
  </div>
  <div class="group-item">
    <p class="title">Proxy Password</p>
    <div class="input-tip">
      <input class="input" type="text" id="proxyPassword" onChange='valueChanged()' {%if settings.proxy_password%} value="{{settings.proxy_password}}" {%endif%}></input>
      <p class="tip">You only need to enter a username and password if one is required. Leave them blank otherwise.</p>
    </div>
  </div>
</div>

<script>
  const initialValues = {
    useProxy: {{settings.use_proxy|yesno:"true,false"}},
    proxyType: "{{settings.proxy_type|default:''}}",
    proxyHost: "{{settings.proxy_host|default:''}}",
    proxyPort: "{{settings.proxy_port|default:''}}",
    proxyUsername: "{{settings.proxy_username|default:''}}",
    proxyPassword: "{{settings.proxy_password|default:''}}",
  }

  var changed = false;

  function valueChanged() {
    changed = false;
    Object.keys(initialValues).forEach(key => {
      const input = document.getElementById(key);
      var currentValue = input.value;
      if(key == "useProxy"){
        currentValue = input.checked;
      }
      if (initialValues[key] != currentValue){
        changed = true;
      }
    })
   
    if(changed){
      document.getElementById("save-button").classList.remove("disabled");
      document.getElementById("save-button-text").innerHTML = "Save";
    } else {
      document.getElementById("save-button").classList.add("disabled");
      document.getElementById("save-button-text").innerHTML = "No Changes";
    }
  }

</script>
